name: Deploy

# Manual only, on purpose: this does not deploy automatically on every push
# to master. Trigger it by hand from the Actions tab (works fine from
# GitHub's mobile web UI, no local machine needed) once CLOUDFLARE_API_TOKEN
# is set as a repository secret (Settings -> Secrets and variables ->
# Actions -> New repository secret). The token needs the "Workers Scripts:
# Edit" permission for this account (see README's deploy notes).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Deps (incl. the pinned wrangler version) live in worker/package.json;
      # deploy still runs from the repo root so it picks up the root
      # wrangler.jsonc (main = worker/src/index.ts, assets = public/, the
      # real D1/R2/AI bindings and the production ACCESS_AUD).
      # npm ci needs a committed lockfile; worker/package-lock.json is
      # gitignored in this repo, so plain install it is.
      - name: Install worker dependencies
        working-directory: worker
        run: npm install

      # Before the deploy, so a new migration is in place by the time the code
      # that needs it goes live. Already-applied migrations are skipped (D1
      # tracks them in d1_migrations), so this is a no-op on most runs. It
      # exists because 0006 sat unapplied for weeks and every tasting note
      # with a taste profile failed in production. Needs the token to carry
      # D1:Edit. The first run failed with code 7403 (token not authorized
      # for D1), so until that permission is added this step must not block
      # deploys: on failure it leaves a warning on the run and the deploy goes
      # ahead. Once the token has D1:Edit, drop continue-on-error so a pending
      # migration can never again be skipped silently.
      - name: Apply D1 migrations
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ./worker/node_modules/.bin/wrangler d1 migrations apply calice-db --remote || {
            echo "::warning title=Migrazioni D1 non applicate::Il token CLOUDFLARE_API_TOKEN non ha il permesso D1:Edit. Le nuove migrazioni in worker/migrations vanno applicate a mano finché non lo si aggiunge."
            exit 1
          }

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: ./worker/node_modules/.bin/wrangler deploy
